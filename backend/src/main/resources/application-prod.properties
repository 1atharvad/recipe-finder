# Active in production (render.yaml sets SPRING_PROFILES_ACTIVE=prod). Unlike the
# base application.properties — which has dev-only fallback defaults so local dev
# works without a .env file — these have no fallback: startup fails immediately if
# JWT_SECRET or ADMIN_PASSWORD aren't set, instead of silently running with a
# publicly-known secret/password.
jwt.secret=${JWT_SECRET}
admin.password=${ADMIN_PASSWORD}
