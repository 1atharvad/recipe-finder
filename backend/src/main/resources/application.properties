spring.application.name=backend
server.port=${PORT:6754}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recipedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:recipe_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:recipe_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Dev-only fallbacks below — application-prod.properties (active via
# SPRING_PROFILES_ACTIVE=prod on Render, see render.yaml) overrides jwt.secret
# and admin.password with no default, so prod fails to start rather than
# silently running with these publicly-known values.
jwt.secret=${JWT_SECRET:a8f3d2c1b0e94567890abcdef1234567890abcdef1234567890abcdef12345678}
jwt.expiration-ms=86400000

admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

gemini.api.key=${GEMINI_API_KEY:}
