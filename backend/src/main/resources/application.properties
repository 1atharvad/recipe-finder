spring.application.name=backend
server.port=${PORT:6754}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recipedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:recipe_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:recipe_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# No fallback defaults for secrets/credentials, dev included — startup fails
# immediately if these env vars aren't set, rather than silently running with
# a known value. Set them via a local .env (see .env.example) for dev.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Every ResponseStatusException in this app is thrown with a deliberately
# user-safe message (e.g. "Email already registered") that the frontend
# displays as-is — Spring's default of omitting it turns every error into
# a bare {"status":409,"error":"Conflict"} with no way to tell the user why.
server.error.include-message=always

gemini.api.key=${GEMINI_API_KEY}
