server {
    listen 8080;

    server_name _;

    # Reverse proxy to the Spring Boot backend.
    # Frontend is deployed separately on Vercel and is not served from here.
    location /api/v1/ {
        proxy_pass http://backend:6754;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
